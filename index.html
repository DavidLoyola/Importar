function parsePipeCsvWithQuotes(text, delimiter = "|", quote = '"') {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];
    if (ch === quote) {
      if (inQuotes && next === quote) {
        cell += quote;
        i++;
      } else {
        inQuotes = !inQuotes;
      }
      continue;
    }
    if (ch === delimiter && !inQuotes) {
      row.push(cell);
      cell = "";
      continue;
    }
    if ((ch === "\n" || ch === "\r") && !inQuotes) {
      if (ch === "\r" && next === "\n") i++;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
      continue;
    }
    cell += ch;
  }
  if (cell.length > 0 || row.length > 0) {
    row.push(cell);
    rows.push(row);
  }
  // Trim cells
  return rows.map(r => r.map(c => c.trim()));
}

function arrayRowToObject(row, expectedColumns) {
  const obj = {};
  for (let i = 0; i < expectedColumns.length; i++) {
    const name = expectedColumns[i].name;
    obj[name] = row[i] !== undefined ? row[i] : "";
  }
  return obj;
}

function readFileAsArrayBufferPromise(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = e => reject(e);
    reader.readAsArrayBuffer(file);
  });
}

function downloadText(filename, content, mime='text/plain') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toCSV(rows, headers) {
  const esc = v => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    if (s.includes('"') || s.includes(',') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const head = headers.join(",");
  const body = rows.map(r => headers.map(h => esc(r[h] ?? "")).join(",")).join("\n");
  return head + "\n" + body;
}

  });
}



function applyColumnFilter(colIndex, rawValue) {
  const value = (rawValue || "").toLowerCase();
  columnFilters[colIndex] = value;

  filteredItems = allItems.filter(item =>
    item.cells.every((cell, idx) => {
      const f = columnFilters[idx];
      if (!f) return true; // sin filtro en esa columna

      const cellVal = (cell || "").toLowerCase();

      // caso especial: si el filtro es "vacío" o "empty"
      if (f === "vacío" || f === "empty") {
        return cellVal === "";
      }

      return cellVal.includes(f);
    })
  );

  currentPage = 1;
  renderTablePage();
  document.getElementById("tableContainer").style.display =
    filteredItems.length > 0 ? "block" : "none";
}



 function renderTablePage() {
  const pageSize = parseInt(pageSizeSelect.value, 10);
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageRows = filteredItems.slice(start, end);

  body.innerHTML = "";

  if (pageRows.length === 0) {
    // Mostrar mensaje de "sin resultados"
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = expectedColumns.length; // ocupa todas las columnas
    td.textContent = "⚠️ No se encontraron resultados con los filtros aplicados.";
    td.className = "no-results";
    tr.appendChild(td);
    body.appendChild(tr);

    // desactivar paginación
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    pageInfo.textContent = `Página 0 de 0 — 0 filas`;
  } else {
    // Pintar filas normales
    for (const item of pageRows) {
      const tr = document.createElement("tr");
      if (item.hasWarning) tr.classList.add("warning");
      for (const cell of item.cells) {
        const td = document.createElement("td");
        td.textContent = cell;
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }

    const totalPages = Math.max(1, Math.ceil(filteredItems.length / pageSize));
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
    pageInfo.textContent = `Página ${currentPage} de ${totalPages} — ${filteredItems.length} filas`;
  }

  // mantener siempre visible el contenedor
  document.getElementById("tableContainer").style.display = "block";
}


  // Búsqueda
  function applySearch() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      filteredItems = allItems.slice();
    } else {
      filteredItems = allItems.filter(item =>
        item.cells.some(cell => (cell || "").toLowerCase().includes(q))
      );
    }
    currentPage = 1;
    renderTablePage();
  }

  // Paginación
  function setupPagination() {
    tableControls.style.display = "flex";
    paginationEl.style.display = "flex";
    searchInput.value = "";
    pageSizeSelect.value = pageSizeSelect.value || "10";
    searchInput.oninput = applySearch;
    pageSizeSelect.onchange = function() { currentPage = 1; renderTablePage(); };
    prevBtn.onclick = function() { if (currentPage > 1) { currentPage--; renderTablePage(); } };
    nextBtn.onclick = function() {
      const pageSize = parseInt(pageSizeSelect.value, 10);
      const totalPages = Math.max(1, Math.ceil(filteredItems.length / pageSize));
      if (currentPage < totalPages) { currentPage++; renderTablePage(); }
    };
  }

  csvForm.addEventListener("submit", function(e) {
    e.preventDefault();
    warnings = [];
    allItems = [];
    filteredItems = [];
    currentPage = 1;
    resultDiv.className = "";
    resultDiv.textContent = "";
    headerRow.innerHTML = "";
    body.innerHTML = "";
    tableControls.style.display = "none";
    paginationEl.style.display = "none";
    if (!fileInput.files.length) {
      resultDiv.textContent = "⚠️ Por favor, selecciona un archivo CSV.";
      resultDiv.classList.add("warning");
      return;
    }
    const option = optionEl.value;
    const expectedConfig = config[option];
    if (!expectedConfig) {
      resultDiv.textContent = "❌ No hay configuración para la opción seleccionada.";
      resultDiv.classList.add("error");
      return;
    }
    const expectedColumns = expectedConfig.columns;
    const delimiter = expectedConfig.delimiter || ",";
    renderHeader(expectedColumns);

    const file = fileInput.files[0];
    readFileAsArrayBufferPromise(file).then(buffer => {
      const decoder = new TextDecoder("windows-1252");
      const text = decoder.decode(buffer);
      const rows = parsePipeCsvWithQuotes(text, delimiter, '"');
      const nonEmptyRows = rows.filter(r => r.some(c => c.length > 0));
      let globalValid = true;
      let errorRow = null;
      let errorMsg = "";
      for (let i = 0; i < nonEmptyRows.length; i++) {
        const cells = nonEmptyRows[i];
        let rowValid = true;
        let trWarnings = [];
        if (cells.length !== expectedColumns.length) {
          rowValid = false;
          errorMsg = `Fila ${i+1}: tiene ${cells.length} columnas, se esperaban ${expectedColumns.length}.`;
        } else {
          for (let colIndex = 0; colIndex < expectedColumns.length; colIndex++) {
            const col = expectedColumns[colIndex];
            const value = (cells[colIndex] || "").trim();
            if (col.type === "number") {
              if (value !== "") {
                const normalized = value.replace(',', '.');
                if (isNaN(Number(normalized))) {
                  rowValid = false;
                  errorMsg = `Fila ${i+1}: columna ${col.name} debe ser número.`;
                  break;
                }
              } else if (col.required) {
                trWarnings.push(col.name);
                warnings.push({ row: i+1, col: col.name });
              }
            }
            if (col.type === "date") {
              const v = value;
              if (v !== "") {
                const match = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if (match) {
                  const day = parseInt(match[1], 10);
                  const month = parseInt(match[2], 10) - 1;
                  const year = parseInt(match[3], 10);
                  const d = new Date(year, month, day);
                  if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) {
                    rowValid = false;
                    errorMsg = `Fila ${i+1}: columna ${col.name} no es fecha válida (dd/mm/yyyy).`;
                    break;
                  }
                } else if (isNaN(Date.parse(v))) {
                  rowValid = false;
                  errorMsg = `Fila ${i+1}: columna ${col.name} no es fecha válida.`;
                  break;
                }
              } else if (col.required) {
                trWarnings.push(col.name);
                warnings.push({ row: i+1, col: col.name });
              }
            }

              // Email
            if (col.type === "email" && value !== "" && !value.includes("@")) {
              rowValid = false;
              errorMsg = `Fila ${i+1}: columna ${col.name} no es email válido.`;
              break;
            }

              // Longitud máxima
            if (col.maxLength && value.length > col.maxLength) {
              rowValid = false;
              errorMsg = `Fila ${i+1}: columna ${col.name} supera ${col.maxLength} caracteres.`;
              break;
            }

              // Required vacío (warning)
            if (col.required && value === "") {
              trWarnings.push(col.name);
              warnings.push({ row: i+1, col: col.name });
            }
          }
        }
        if (!rowValid) {
          globalValid = false;
          errorRow = cells.slice();
          break;
        } else {
          allItems.push({ cells, hasWarning: trWarnings.length > 0 });
        }
      }

        // Pinta resultado y tabla
      if (globalValid) {
        resultDiv.textContent = "✅ CSV válido para la opción " + option;
        resultDiv.className = "success";
        setupPagination();
        filteredItems = allItems.slice();
        currentPage = 1;
        renderTablePage();
        if (exportBtn) {
          exportBtn.style.display = "inline-block";
          exportBtn.onclick = function() {
            // generar SQL sencillo basado en expectedColumns
            const items = allItems.map(it => ({ cells: it.cells }));
            const sql = generateSQLForValidation(items, option);
            downloadText('datos.sql', sql, 'text/sql');
          };
        }
      } else {
        resultDiv.textContent = "❌ El CSV contiene errores.";
        resultDiv.className = "error";
        body.innerHTML = "";
        const tr = document.createElement("tr");
        tr.classList.add("error");
        for (const cell of errorRow) {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        }
        body.appendChild(tr);
        const msgRow = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = expectedColumns.length;
        td.innerHTML = `<span class="error-msg">${errorMsg}</span>`;
        msgRow.appendChild(td);
        body.appendChild(msgRow);
        tableControls.style.display = "none";
        paginationEl.style.display = "none";
        if (exportBtn) exportBtn.style.display = "none";
        tableContainer.style.display = "block"; // mostrar tabla con error
      }

      if (warnings.length > 0) {
        const msg = document.createElement("div");
        msg.className = "warning-msg";
        msg.textContent = `⚠️ Se han detectado ${warnings.length} warnings en campos obligatorios vacíos.`;
        const switchContainer = document.createElement("div");
        switchContainer.className = "warning-switch";
        switchContainer.innerHTML = `
          <label class="switch">
            <input type="checkbox" id="toggleWarningsSwitch">
            <span class="slider"></span>
          </label>
          <span class="label-text">Ver solo warnings</span>
        `;
        msg.appendChild(switchContainer);
        resultDiv.appendChild(msg);
        const toggle = document.getElementById("toggleWarningsSwitch");
        toggle.addEventListener("change", () => {
          const active = toggle.checked;
          filteredItems = active ? allItems.filter(item => item.hasWarning) : allItems.slice();
          currentPage = 1;
          renderTablePage();
       
        });
      }
    }).catch(err => {
      resultDiv.textContent = "❌ Error leyendo el archivo: " + err;
      resultDiv.className = "error";
    });
  });

  function generateSQLForValidation(items, option, batchSize = 100) {
    const expectedColumns = config[option].columns.map(c => c.name);
    let sql = "";
    for (let i = 0; i < items.length; i += batchSize) {
      const batch = items.slice(i, i + batchSize);
      sql += `INSERT INTO ${option.toLowerCase()} (${expectedColumns.join(", ")}) VALUES\n`;
      sql += batch.map(item => "(" + item.cells.map(v => {
        const safe = (v || "").replace(/'/g, "''");
        return isNaN(v) || v === "" ? `'${safe}'` : safe;
      }).join(", ") + ")").join(",\n");
      sql += ";\n\n";
    }
    return sql;
  }

})();

(function setupCompare() {
  const optionCompareEl = document.getElementById('optionCompare');
  const fileOldEl = document.getElementById('fileOld');
  const fileNewEl = document.getElementById('fileNew');
  const compareBtn = document.getElementById('compareBtn');
  const compareSummary = document.getElementById('compareSummary');
  const addedBlock = document.getElementById('addedBlock');
  const deletedBlock = document.getElementById('deletedBlock');
  const modifiedBlock = document.getElementById('modifiedBlock');
  const addedTable = document.getElementById('addedTable');
  const deletedTable = document.getElementById('deletedTable');
  const modifiedTable = document.getElementById('modifiedTable');
  const exportAdded = document.getElementById('exportAdded');
  const exportDeleted = document.getElementById('exportDeleted');
  const exportModified = document.getElementById('exportModified');

  function renderObjectTable(tableEl, headers, rows) {
    const thead = tableEl.querySelector('thead');
    const tbody = tableEl.querySelector('tbody');
    thead.innerHTML = "";
    tbody.innerHTML = "";
    const trh = document.createElement('tr');
    headers.forEach(h => {
      const th = document.createElement('th'); th.textContent = h; trh.appendChild(th);
    });
    thead.appendChild(trh);
    for (const r of rows) {
      const tr = document.createElement('tr');
      headers.forEach(h => {
        const td = document.createElement('td');
        td.textContent = r[h] ?? "";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
  }

  async function readCsvFileToObjects(file, optionKey) {
    const cfg = config[optionKey];
    const delim = (cfg && cfg.delimiter) ? cfg.delimiter : ",";
    const buf = await readFileAsArrayBufferPromise(file);
    const decoder = new TextDecoder("windows-1252");
    const text = decoder.decode(buf);
    const rows = parsePipeCsvWithQuotes(text, delim, '"');
    const nonEmpty = rows.filter(r => r.some(c => c.length > 0));
    const expectedColumns = cfg ? cfg.columns : null;
    if (!expectedColumns) throw new Error("No hay configuración para opción: " + optionKey);
    const objects = nonEmpty.map(r => arrayRowToObject(r, expectedColumns));
    return { objects, expectedColumns: expectedColumns.map(c => c.name) };
  }

  function makeKeyForObj(obj, keyCols, ignoreWhitespace = true) {
    const parts = keyCols.map(k => {
      let v = (obj[k] === undefined || obj[k] === null) ? "" : String(obj[k]);
      return ignoreWhitespace ? v.replace(/\s+/g, " ").trim() : v;
    });
    return parts.join("||");
  }

  function objectsEqual(a, b, ignoreWhitespace = true) {
    // shallow compare all keys present in a or b
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    for (const k of keys) {
      let va = a[k] === undefined ? "" : String(a[k]);
      let vb = b[k] === undefined ? "" : String(b[k]);
      if (ignoreWhitespace) { va = va.replace(/\s+/g, " ").trim(); vb = vb.replace(/\s+/g, " ").trim(); }
      if (va !== vb) return false;
    }
    return true;
  }

  compareBtn.addEventListener('click', async () => {
    // reset UI
    compareSummary.textContent = "";
    addedBlock.style.display = deletedBlock.style.display = modifiedBlock.style.display = "none";
    if (!optionCompareEl.value) {
      compareSummary.textContent = "⚠️ Selecciona un tipo de archivo.";
      compareSummary.className = "warning";
      return;
    }
    if (!fileOldEl.files.length || !fileNewEl.files.length) {
      compareSummary.textContent = "⚠️ Selecciona ambos ficheros (anterior y actual).";
      compareSummary.className = "warning";
      return;
    }
    const optionKey = optionCompareEl.value;
    const keyCols = keyColumnsMap[optionKey];
    if (!keyCols || !keyCols.length) {
      compareSummary.textContent = "❌ No hay clave(s) primaria(s) configurada(s) para este tipo.";
      compareSummary.className = "error";
      return;
    }
    compareSummary.textContent = "⏳ Leyendo ficheros...";
    compareSummary.className = "";

    try {
      const [oldRes, newRes] = await Promise.all([
        readCsvFileToObjects(fileOldEl.files[0], optionKey),
        readCsvFileToObjects(fileNewEl.files[0], optionKey)
      ]);
      const oldObjs = oldRes.objects;
      const newObjs = newRes.objects;
      const headers = oldRes.expectedColumns; // usar columnas esperadas

      const ignoreWhitespace = document.getElementById('ignoreWhitespace').checked;
      const includeModified = document.getElementById('includeModified').checked;

      const mapOld = new Map();
      const mapNew = new Map();

      for (const o of oldObjs) mapOld.set(makeKeyForObj(o, keyCols, ignoreWhitespace), o);
      for (const n of newObjs) mapNew.set(makeKeyForObj(n, keyCols, ignoreWhitespace), n);

      const added = [];
      const deleted = [];
      const modified = [];

      // check deleted and modified
      for (const [k, o] of mapOld.entries()) {
        if (!mapNew.has(k)) {
          deleted.push(o);
        } else {
          const n = mapNew.get(k);
          if (!objectsEqual(o, n, ignoreWhitespace)) {
            modified.push({ before: o, after: n });
          }
        }
      }
      // check added
      for (const [k, n] of mapNew.entries()) {
        if (!mapOld.has(k)) {
          added.push(n);
        }
      }

      // Mostrar resumen
      compareSummary.textContent = `Resultados: ${added.length} añadidos — ${deleted.length} eliminados — ${modified.length} modificados.`;
      compareSummary.className = "success";

      // Render tablas
      if (added.length > 0) {
        addedBlock.style.display = "block";
        renderObjectTable(addedTable, headers, added);
      } else addedBlock.style.display = "none";

      if (deleted.length > 0) {
        deletedBlock.style.display = "block";
        renderObjectTable(deletedTable, headers, deleted);
      } else deletedBlock.style.display = "none";

      if (includeModified && modified.length > 0) {
        modifiedBlock.style.display = "block";
        // Para modificados, mostramos columnas clave + diferencia: concat old->new en columnas
        const modHeaders = headers.slice();
        const modRows = modified.map(m => {
          const row = {};
          for (const h of modHeaders) {
            const beforeVal = m.before[h] ?? "";
            const afterVal = m.after[h] ?? "";
            row[h] = (String(beforeVal) === String(afterVal)) ? beforeVal : `${beforeVal} → ${afterVal}`;
          }
          return row;
        });
        renderObjectTable(modifiedTable, modHeaders, modRows);
      } else modifiedBlock.style.display = "none";

      // Asociar exportaciones
      exportAdded.onclick = () => {
        if (added.length === 0) return alert("No hay registros añadidos para exportar.");
        const csv = toCSV(added, headers);
        downloadText('añadidos.csv', csv, 'text/csv');
      };
      exportDeleted.onclick = () => {
        if (deleted.length === 0) return alert("No hay registros eliminados para exportar.");
        const csv = toCSV(deleted, headers);
        downloadText('eliminados.csv', csv, 'text/csv');
      };
      exportModified.onclick = () => {
        if (modified.length === 0) return alert("No hay registros modificados para exportar.");
        // exportar "before" y "after" en columnas separadas: header_before, header_after
        const beforeHeader = headers.map(h => h + "_before");
        const afterHeader = headers.map(h => h + "_after");
        const csvHeaders = [...beforeHeader, ...afterHeader];
        const rows = modified.map(m => {
          const row = {};
          headers.forEach(h => { row[h + "_before"] = m.before[h] ?? ""; row[h + "_after"] = m.after[h] ?? ""; });
          return row;
        });
        const esc = v => {
          if (v === null || v === undefined) return '';
          const s = String(v);
          if (s.includes('"') || s.includes(',') || s.includes('\n')) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        };
        const head = csvHeaders.join(",");
        const body = rows.map(r => csvHeaders.map(h => esc(r[h] ?? "")).join(",")).join("\n");
        downloadText('modificados.csv', head + "\n" + body, 'text/csv');
      };

    } catch (err) {
      compareSummary.textContent = "❌ Error leyendo/parseando ficheros: " + err.message;
      compareSummary.className = "error";
    }
  });

})();

const container = document.getElementById('tableContainer');
if (container) {
  let isDragging = false, startX = 0, scrollStart = 0, rafId = null;
  container.addEventListener('mousedown', (e) => { isDragging = true; container.classList.add('dragging'); startX = e.pageX - container.offsetLeft; scrollStart = container.scrollLeft; });
  container.addEventListener('mouseup', () => { isDragging = false; container.classList.remove('dragging'); cancelAnimationFrame(rafId); });
  container.addEventListener('mouseleave', () => { isDragging = false; container.classList.remove('dragging'); cancelAnimationFrame(rafId); });
  container.addEventListener('mousemove', (e) => { if (!isDragging) return; e.preventDefault(); const x = e.pageX - container.offsetLeft; const walk = (x - startX) * 1.5; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(() => { container.scrollLeft = scrollStart - walk; }); });
  // táctil
  let touchStartX = 0, touchScrollStart = 0;
  container.addEventListener('touchstart', (e) => { container.classList.add('dragging'); touchStartX = e.touches[0].pageX; touchScrollStart = container.scrollLeft; }, { passive:true });
  container.addEventListener('touchmove', (e) => { e.preventDefault(); const touchX = e.touches[0].pageX; const walk = (touchX - touchStartX) * 1.5; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(() => { container.scrollLeft = touchScrollStart - walk; }); }, { passive:false });
  container.addEventListener('touchend', () => { container.classList.remove('dragging'); cancelAnimationFrame(rafId); });
}

const btn = document.getElementById("themeToggle");
const body = document.body;
if (localStorage.getItem("theme") === "dark") { body.classList.add("theme-dark"); btn.setAttribute("aria-pressed", "true"); } else { btn.setAttribute("aria-pressed", "false"); }
btn.addEventListener("click", () => {
  const isDark = body.classList.toggle("theme-dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
  btn.setAttribute("aria-pressed", isDark ? "true" : "false");
});
